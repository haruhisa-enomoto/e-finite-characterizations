version: "v0.4"

project:
  name: "Characterizations of E-finite algebras and conjectures on brick-finiteness"
  description: >-
    A Mathlib-only Lean 4 formalization of the manuscript Characterizations of
    E-finite algebras and conjectures on brick-finiteness by Haruhisa Enomoto. A
    finite-dimensional algebra over a field is E-finite when its two-term silting
    fan covers the integral projective lattice K₀(proj Λ). Theorem A proves that
    E-finiteness is equivalent over an arbitrary field to seventeen conditions—including
    nonzero morphisms between nonzero modules of equal dimension vector (K₀-Hom),
    injectivity of dimension-vector maps on torsion-class Grothendieck monoids,
    functorial finiteness of compact torsion classes and wide subcategories,
    finiteness of semibricks, finiteness of bricks of each endolength, polynomial
    brick growth, absence of generic bricks and generic grains, presilting
    generation of two-term thick subcategories, and finite-dimensionality of
    universal localizations and simple Artinian epimorphic targets—together with
    two dimension-vector finiteness conditions over infinite fields and three
    geometric conditions (King moduli closed points, open brick orbits, and open
    wide loci) over algebraically closed fields. Consequently, seven open
    brick-finiteness conjectures (including Demonet's lattice point conjecture,
    the finite semibrick conjecture, the second brick-Brauer–Thrall conjecture,
    and Mousavand–Paquette's generic brick conjecture) become equivalent for each
    algebra. Theorem B proves this common conjecture in rank at most two over any
    field, equating E-finiteness, brick-finiteness, and τ-tilting finiteness.
    Corollary C proves Weyman's conjecture over algebraically closed fields of
    arbitrary characteristic, equating Schur-representation-finiteness with
    multiplicity-freeness on every irreducible component. Intended for researchers
    in the representation theory of finite-dimensional algebras, silting and
    τ-tilting theory, and module varieties.
  authors: ["Haruhisa Enomoto"]
  responsible_maintainers: ["Haruhisa Enomoto"]
  license: "Apache-2.0"

