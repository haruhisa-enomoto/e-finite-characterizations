      lean: "EFiniteCharacterizations.Challenge.arbitraryField"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution.lean via EFiniteCharacterizations.proveArbitraryField, calling equivalences_arbitraryField and isEFinite_iff_twoTermThickGeneration."
    - source: "Theorem A(II): dimension-vector characterizations (dim-brick) and (dim-stab) over infinite fields"
      lean: "EFiniteCharacterizations.Challenge.infiniteField"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution.lean via EFiniteCharacterizations.proveInfiniteField, calling isEFinite_iff_finite_brickClassesOfClass and isEFinite_iff_finite_stableClassesOfClass (counterpart to equivalences_infiniteField)."
    - source: "Theorem A(III): geometric characterizations (moduli-pt), (open-brick), and (open-wide) over algebraically closed fields"
      lean: "EFiniteCharacterizations.Challenge.algebraicallyClosedField"
      module: "Challenge"
