status:
  scope: >-
    The five compared declarations state Theorem A(I), A(II), A(III), Theorem B and
    Corollary C. The proof library also covers the numbered body and appendix results
    listed in docs/PAPER-CORRESPONDENCE.md. Each proof uses only Lean core and Mathlib.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-6 family"]
      framework: "OpenAI Codex"
      tool_setup: "Lean compiler, pinned Mathlib, declaration and axiom audits, and independently stated comparison endpoints."
      prompting_notes: "Formalize the manuscript under the author's direction. Alternative proof routes are permitted."
  notes: "The Lean proof terms were developed under Haruhisa Enomoto's direction. Authorship and borrowed components are documented in PROVENANCE.md and VENDORED.md."

fidelity:
  divergences: >-
    Right modules are left modules over the opposite algebra. Integral weights are represented
    by differences of finite projectives. Composition vectors are identified with exact
    Grothendieck classes by the finite-length decomposition into simples. The two-term thick
    condition uses the fully faithful realization of bounded projective complexes in the ambient
    homotopy category, with its comparison theorem in the library. The geometric statement
    proves existence of a split basic presentation and quantifies over all such presentations.
    The paper uses one basic representative. All algebras, ground fields and modules are taken
    in one arbitrary universe. See docs/proofs/PROOF-ROUTES.md for the different proof routes.

review:
