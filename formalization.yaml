version: "v0.4"

project:
  name: "Characterizations of E-finite algebras and conjectures on brick-finiteness"
  description: >-
    For a finite-dimensional algebra, E-finiteness means that the two-term silting fan
    covers the integral projective lattice. Theorem A relates this property to seventeen
    tests over arbitrary fields, two fixed-vector counts over infinite fields, and three
    geometric conditions over algebraically closed fields. The arbitrary-field tests include
    nonzero morphisms between modules of equal class, injectivity of the dimension maps of
    torsion-class Grothendieck monoids, finiteness of semibricks, absence of generic bricks and grains,
    thick generation, and finiteness of localization targets. The geometric tests use closed
    points of King moduli, open brick orbits and open wide loci. Theorem B equates E-finiteness,
    brick-finiteness and tau-tilting finiteness in rank at most two. Corollary C identifies
    brick-discreteness with multiplicity-freeness on every irreducible component in arbitrary
    characteristic. The intended readers are representation theorists studying finite-dimensional
    algebras, silting theory, stability and representation varieties.
  authors: ["Haruhisa Enomoto"]
  responsible_maintainers: ["Haruhisa Enomoto"]
  license: "Apache-2.0"

