fidelity:
  divergences: >-
    Right modules over R are formalized as left modules over Rᵐᵒᵖ. Integral weights
    in K₀(proj Λ) are represented as differences [Q] - [P] of finitely generated
    projectives, and dimension vectors are encoded by classes in the exact
    Grothendieck group K₀(mod Λ) (identified with simple-multiplicity vectors in
    the library). In Theorem A(I), the two-term thick condition (thick-gen) uses
    the canonical realization of two-term projective complexes inside K(mod Λ),
    with equivalence to the thick envelope inside Kᵇ(proj Λ) proved in
    BoundedProjectiveHomotopy.lean. In Theorem A(III) and Corollary C, Statement.lean
    packages a Morita-equivalent split basic presentation with complete orthogonal
    vertex idempotents as Statement.Chart k R, proves Nonempty (Chart k R) for
    every finite-dimensional algebra over an algebraically closed field, and
    quantifies the geometric conditions over all such charts (whereas the paper
    fixes one basic representative). Three proof routes differ from the paper's
    citations: Proposition 7.6 constructs generic grains via Malcev–Neumann
    well-ordered series on a bi-ordered free group instead of Cohn's universal
    skew field; Theorem 6.1 proves King's closed-point condition directly by
    splitting extensions in Proj; and Theorem 7.8 includes a direct rank-induction
    proof of finite-dimensionality of universal localizations via rigid pencils.
    All rings, fields, and modules live in one arbitrary universe u.

review:
  status: "unreviewed"
  notes: >-
    No independent human expert review of the Lean statements or proof terms has
    been recorded. All 6,463 declarations across the proof library and
    Solution.lean compile in the Lean 4 kernel and pass the full declaration
    axiom scan; the external checkers NanoDa and con-ron (via lake comparator)
    replay the five Challenge endpoint proofs in Solution.lean together with
    their transitive proof dependencies.

